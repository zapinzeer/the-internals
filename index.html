<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Internals</title>
<meta name="description" content="An interactive tour of what is inside a PC: CPU, GPU, RAM, storage, motherboard and power supply. English and Serbian.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/site.css">
<script>
  document.documentElement.classList.add("mjs");
  try { if (localStorage.getItem("internals-motion") === "off") document.documentElement.classList.add("calm"); } catch (e) { }
</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="cursor-glow" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="lens" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
    <feImage id="lensMap" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="0.14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#cpu"><span class="brand-chip" aria-hidden="true"></span><span class="brand-text" data-i18n="site.brand">The Internals</span></a>
    <nav class="partnav" data-i18n-aria="site.nav.label" aria-label="Parts of the PC"></nav>
    <button type="button" class="motion-toggle" aria-pressed="true"><i aria-hidden="true"></i><span data-i18n="ui.motion">Motion</span></button>
    <div class="langswitch" role="group" data-i18n-aria="site.lang.label" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
      <button type="button" data-lang="sr" aria-pressed="false" lang="sr-Latn">SR</button>
    </div>
  </div>
  <div class="progress" aria-hidden="true"></div>
</header>

<main id="top">
<section data-part="cpu" id="cpu-sec" aria-labelledby="cpu-title">

  <div class="hero wrap">
    <div class="hero-grid">
      <div class="hero-text">
        <p class="eyebrow" data-i18n="cpu.eyebrow">Part 01 · The processor</p>
        <h1 id="cpu-title">CPU<span class="sub" data-i18n="cpu.full">Central Processing Unit</span></h1>
        <p class="lede" data-i18n="cpu.lede"></p>
        <div class="specs">
          <dl><div><dt data-i18n="cpu.spec.clock">Clock speed</dt><dd>3–6 GHz</dd></div></dl>
          <dl><div><dt data-i18n="cpu.spec.cores">Cores</dt><dd>6–24</dd></div></dl>
          <dl><div><dt data-i18n="cpu.spec.transistors">Transistors</dt><dd data-i18n="cpu.spec.transistors.v">~20 billion</dd></div></dl>
          <dl><div><dt data-i18n="cpu.spec.power">Power draw</dt><dd>65–250 W</dd></div></dl>
        </div>
        <p class="fineprint" data-i18n="cpu.fineprint"></p>
      </div>

      <div>
        <div class="viewer" id="cpu3d" data-viewer="cpu" data-flip data-explode="75"></div>
      </div>
    </div>
  </div>

  <div class="chapter" id="switches">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="cpu.sw.eyebrow"></p>
        <h2 data-i18n="cpu.sw.title"></h2>
        <div class="prose">
          <p data-i18n-html="cpu.sw.p1"></p>
          <p data-i18n-html="cpu.sw.p2"></p>
        </div>
      </div>
      <div class="stage">
        <div class="stage-body switch-grid">
          <div class="scroll-x"><svg id="mosfet" viewBox="0 0 420 260" width="100%" role="img" data-i18n-aria="cpu.sw.mosfet.aria"></svg></div>
          <div class="scroll-x"><svg id="andgate" viewBox="0 0 420 260" width="100%" role="img" data-i18n-aria="cpu.sw.and.aria"></svg></div>
        </div>
        <div class="stage-bar">
          <button class="btn" id="gateBtn" type="button" aria-pressed="false"></button>
          <button class="btn" id="aBtn" type="button" aria-pressed="false"></button>
          <button class="btn" id="bBtn" type="button" aria-pressed="false"></button>
          <span class="readout" id="andOut"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chapter" id="die">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="cpu.die.eyebrow"></p>
        <h2 data-i18n="cpu.die.title"></h2>
        <div class="prose"><p data-i18n="cpu.die.p"></p></div>
      </div>
      <div class="split">
        <div class="stage"><div class="stage-body scroll-x"><svg id="diemap" viewBox="-4 -4 128 96" width="100%" role="img" data-i18n-aria="cpu.die.aria"></svg></div></div>
        <div class="die-info" aria-live="polite">
          <h3 id="dieName"></h3>
          <p id="dieBlurb" class="prose"></p>
          <p id="dieFact" class="mono fineprint"></p>
          <div class="die-legend" id="dieLegend"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="chapter" id="cycle">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="cpu.sim.eyebrow"></p>
        <h2 data-i18n="cpu.sim.title"></h2>
        <div class="prose">
          <p data-i18n-html="cpu.sim.p1"></p>
          <p data-i18n="cpu.sim.p2"></p>
        </div>
      </div>
      <div class="stage">
        <div class="stage-body split">
          <div class="scroll-x"><svg id="sim" viewBox="0 0 760 420" width="100%" style="min-width:520px" role="img" data-i18n-aria="cpu.sim.aria"></svg></div>
          <div class="sim-log" aria-live="polite">
            <div class="sim-phases">
              <span data-ph="fetch" data-i18n="cpu.sim.ph.fetch"></span>
              <span data-ph="decode" data-i18n="cpu.sim.ph.decode"></span>
              <span data-ph="execute" data-i18n="cpu.sim.ph.execute"></span>
            </div>
            <p class="sim-step-title" id="simTitle"></p>
            <p id="simText" class="prose"></p>
            <ol class="code-list" id="simCode"></ol>
          </div>
        </div>
        <div class="stage-bar">
          <button class="btn primary" id="simStep" type="button" data-i18n="cpu.sim.step"></button>
          <button class="btn" id="simPlay" type="button"></button>
          <button class="btn" id="simReset" type="button" data-i18n="cpu.sim.reset"></button>
          <span class="readout" id="simCount"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chapter" id="clock">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="cpu.clk.eyebrow"></p>
        <h2 data-i18n="cpu.clk.title"></h2>
        <div class="prose"><p data-i18n-html="cpu.clk.p"></p></div>
      </div>
      <div class="stage">
        <div class="stage-body"><canvas id="clockwave" style="width:100%;height:120px;display:block" role="img" data-i18n-aria="cpu.clk.aria"></canvas></div>
        <div class="stage-bar">
          <div class="range" style="max-width:420px">
            <label for="ghz" data-i18n="cpu.clk.label"></label>
            <input type="range" id="ghz" min="10" max="60" value="50">
            <span class="mono" id="ghzVal" style="min-width:64px"></span>
          </div>
          <span class="readout" id="ghzRead"></span>
        </div>
      </div>

      <div class="chapter-head" style="margin-top:56px">
        <h3 style="font-size:34px" data-i18n="cpu.pipe.title"></h3>
        <div class="prose"><p data-i18n="cpu.pipe.p"></p></div>
      </div>
      <div class="stage">
        <div class="stage-body scroll-x"><table class="pipe-table" id="pipe"></table></div>
        <div class="stage-bar">
          <button class="btn" id="pipeToggle" type="button" aria-pressed="true"></button>
          <button class="btn primary" id="pipePlay" type="button" data-i18n="cpu.pipe.run"></button>
          <div class="stats" style="margin-left:auto">
            <div class="stat"><b id="pipeCycles">9</b><span data-i18n="cpu.pipe.cycles"></span></div>
            <div class="stat"><b id="pipeIpc"></b><span data-i18n="cpu.pipe.ipc"></span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="chapter" id="cache">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="cpu.mem.eyebrow"></p>
        <h2 data-i18n="cpu.mem.title"></h2>
        <div class="prose">
          <p data-i18n-html="cpu.mem.p1"></p>
          <p data-i18n="cpu.mem.p2"></p>
        </div>
      </div>
      <div class="stage">
        <div class="stage-body"><div class="ladder" id="ladder"></div></div>
        <div class="stage-bar">
          <button class="btn primary" id="raceBtn" type="button" data-i18n="cpu.mem.race"></button>
          <span class="readout" data-i18n="cpu.mem.log"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chapter" id="cores">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="cpu.cores.eyebrow"></p>
        <h2 data-i18n="cpu.cores.title"></h2>
        <div class="prose">
          <p data-i18n="cpu.cores.p1"></p>
          <p data-i18n-html="cpu.cores.p2"></p>
        </div>
      </div>
      <div class="stage">
        <div class="stage-body"><div class="cores-grid" id="coresGrid"></div></div>
        <div class="stage-bar">
          <div class="btn-row" role="group" data-i18n-aria="cpu.cores.group" id="coreBtns"></div>
          <button class="btn" id="serialBtn" type="button" aria-pressed="false"></button>
          <button class="btn primary" id="coresRun" type="button" data-i18n="cpu.cores.run"></button>
          <span class="readout" id="coresRead"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chapter" id="quiz">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="cpu.quiz.eyebrow"></p>
        <h2 data-i18n="cpu.quiz.title"></h2>
        <div class="prose"><p data-i18n="cpu.quiz.p"></p></div>
      </div>
      <div class="quiz" id="quizBox"></div>
    </div>
  </div>

  <div class="chapter lab-chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="ui.test.eyebrow"></p>
        <h2 data-i18n="ui.test.title"></h2>
        <div class="prose"><p data-i18n="ui.test.p"></p></div>
      </div>
      <div data-labtest="cpu"></div>
    </div>
  </div>
</section>

<section data-part="gpu" id="gpu-sec" aria-labelledby="gpu-title" hidden>
  <div class="hero wrap">
    <div class="hero-grid">
      <div class="hero-text">
        <p class="eyebrow" data-i18n="gpu.eyebrow"></p>
        <h1 id="gpu-title">GPU<span class="sub" data-i18n="gpu.full"></span></h1>
        <p class="lede" data-i18n="gpu.lede"></p>
        <div class="specs">
          <dl><div><dt data-i18n="gpu.spec.cores"></dt><dd data-i18n="gpu.spec.cores.v"></dd></div></dl>
          <dl><div><dt data-i18n="gpu.spec.vram"></dt><dd data-i18n="gpu.spec.vram.v"></dd></div></dl>
          <dl><div><dt data-i18n="gpu.spec.bw"></dt><dd data-i18n="gpu.spec.bw.v"></dd></div></dl>
          <dl><div><dt data-i18n="gpu.spec.power"></dt><dd data-i18n="gpu.spec.power.v"></dd></div></dl>
        </div>
        <p class="fineprint" data-i18n="gpu.fineprint"></p>
      </div>
      <div>
        <div class="viewer" id="gpu3d" data-viewer="gpu" data-flip data-explode="70"></div>
      </div>
    </div>
  </div>

  <div class="chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="gpu.par.eyebrow"></p>
        <h2 data-i18n="gpu.par.title"></h2>
        <div class="prose"><p data-i18n="gpu.par.p1"></p><p data-i18n="gpu.par.p2"></p></div>
      </div>
      <div class="stage">
        <div class="stage-body race-grid">
          <div class="race-lane"><p class="race-name" data-i18n="gpu.par.cpu"></p><canvas id="raceCpu" class="pixcanvas"></canvas><div class="race-meter"><i id="raceCpuBar"></i></div><p class="mono race-time" id="raceCpuT"></p></div>
          <div class="race-lane"><p class="race-name" data-i18n="gpu.par.gpu"></p><canvas id="raceGpu" class="pixcanvas"></canvas><div class="race-meter"><i id="raceGpuBar"></i></div><p class="mono race-time" id="raceGpuT"></p></div>
        </div>
        <div class="stage-bar">
          <button class="btn primary" id="raceRun" type="button" data-i18n="gpu.par.run"></button>
          <span class="readout" data-i18n="gpu.par.note"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="gpu.pipe.eyebrow"></p>
        <h2 data-i18n="gpu.pipe.title"></h2>
        <div class="prose"><p data-i18n="gpu.pipe.p"></p></div>
      </div>
      <div class="stage">
        <div class="stage-body split">
          <div class="scroll-x"><svg id="gpuPipe" viewBox="0 0 480 320" width="100%" role="img" data-i18n-aria="gpu.pipe.aria"></svg></div>
          <div class="sim-log" aria-live="polite">
            <div class="chips" id="gpuPipeChips"></div>
            <p class="sim-step-title" id="gpuPipeTitle"></p>
            <p class="prose" id="gpuPipeText"></p>
          </div>
        </div>
        <div class="stage-bar">
          <button class="btn" id="gpuPipePrev" type="button" data-i18n="ui.prev"></button>
          <button class="btn primary" id="gpuPipeNext" type="button" data-i18n="ui.next"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="gpu.fps.eyebrow"></p>
        <h2 data-i18n="gpu.fps.title"></h2>
        <div class="prose"><p data-i18n="gpu.fps.p"></p></div>
      </div>
      <div class="stage">
        <div class="stage-body"><canvas id="gpuFps" style="width:100%;height:190px;display:block" role="img" data-i18n-aria="gpu.fps.aria"></canvas></div>
        <div class="stage-bar"><span class="readout" style="margin-left:0" data-i18n="gpu.fps.note"></span></div>
      </div>
    </div>
  </div>

  <div class="chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="ui.quiz.eyebrow"></p>
        <h2 data-i18n="ui.quiz.title3"></h2>
        <div class="prose"><p data-i18n="ui.quiz.p"></p></div>
      </div>
      <div class="quiz three" id="gpuQuiz"></div>
    </div>
  </div>

  <div class="chapter lab-chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="ui.test.eyebrow"></p>
        <h2 data-i18n="ui.test.title"></h2>
        <div class="prose"><p data-i18n="ui.test.p"></p></div>
      </div>
      <div data-labtest="gpu"></div>
    </div>
  </div>
</section>
<section data-part="ram" id="ram-sec" aria-labelledby="ram-title" hidden>
  <div class="hero wrap">
    <div class="hero-grid">
      <div class="hero-text">
        <p class="eyebrow" data-i18n="ram.eyebrow"></p>
        <h1 id="ram-title">RAM<span class="sub" data-i18n="ram.full"></span></h1>
        <p class="lede" data-i18n="ram.lede"></p>
        <div class="specs">
          <dl><div><dt data-i18n="ram.spec.cap"></dt><dd data-i18n="ram.spec.cap.v"></dd></div></dl>
          <dl><div><dt data-i18n="ram.spec.rate"></dt><dd data-i18n="ram.spec.rate.v"></dd></div></dl>
          <dl><div><dt data-i18n="ram.spec.bw"></dt><dd data-i18n="ram.spec.bw.v"></dd></div></dl>
          <dl><div><dt data-i18n="ram.spec.lat"></dt><dd data-i18n="ram.spec.lat.v"></dd></div></dl>
        </div>
        <p class="fineprint" data-i18n="ram.fineprint"></p>
      </div>
      <div>
        <div class="viewer" id="ram3d" data-viewer="ram" data-flip data-explode="70"></div>
      </div>
    </div>
  </div>

  <div class="chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="ram.grid.eyebrow"></p>
        <h2 data-i18n="ram.grid.title"></h2>
        <div class="prose"><p data-i18n="ram.grid.p"></p></div>
      </div>
      <div class="stage">
        <div class="stage-body split">
          <div class="scroll-x"><svg id="ramGrid" viewBox="0 0 540 400" width="100%" role="img" data-i18n-aria="ram.grid.aria"></svg></div>
          <div class="sim-log" aria-live="polite">
            <p class="sim-step-title mono" id="ramGridResult" style="font-size:24px"></p>
            <p class="prose" id="ramGridText"></p>
          </div>
        </div>
        <div class="stage-bar">
          <label class="field"><span data-i18n="ram.grid.row"></span><select id="ramRow"></select></label>
          <label class="field"><span data-i18n="ram.grid.col"></span><select id="ramCol"></select></label>
          <button class="btn primary" id="ramRead" type="button" data-i18n="ram.grid.read"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="ram.ref.eyebrow"></p>
        <h2 data-i18n="ram.ref.title"></h2>
        <div class="prose"><p data-i18n="ram.ref.p"></p></div>
      </div>
      <div class="stage">
        <div class="stage-body scroll-x"><svg id="ramRefresh" viewBox="0 0 580 300" width="100%" style="max-width:820px;display:block;margin-inline:auto" role="img" data-i18n-aria="ram.ref.aria"></svg></div>
        <div class="stage-bar">
          <button class="btn" id="ramRefBtn" type="button" aria-pressed="true"></button>
          <button class="btn" id="ramPowerBtn" type="button" aria-pressed="true"></button>
          <button class="btn primary" id="ramWrite" type="button" data-i18n="ram.ref.write"></button>
          <span class="readout" id="ramKept"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="ram.ddr.eyebrow"></p>
        <h2 data-i18n="ram.ddr.title"></h2>
        <div class="prose"><p data-i18n="ram.ddr.p"></p></div>
      </div>
      <div class="stage">
        <div class="stage-body"><canvas id="ramDdr" style="width:100%;height:230px;display:block" role="img" data-i18n-aria="ram.ddr.aria"></canvas></div>
        <div class="stage-bar">
          <div class="btn-row" id="ramSpeeds"></div>
          <div class="btn-row" id="ramChannels"></div>
          <span class="readout" id="ramBw"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="ui.quiz.eyebrow"></p>
        <h2 data-i18n="ui.quiz.title3"></h2>
        <div class="prose"><p data-i18n="ui.quiz.p"></p></div>
      </div>
      <div class="quiz three" id="ramQuiz"></div>
    </div>
  </div>

  <div class="chapter lab-chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="ui.test.eyebrow"></p>
        <h2 data-i18n="ui.test.title"></h2>
        <div class="prose"><p data-i18n="ui.test.p"></p></div>
      </div>
      <div data-labtest="ram"></div>
    </div>
  </div>
</section>
<section data-part="storage" id="storage-sec" aria-labelledby="sto-title" hidden>
  <div class="hero wrap">
    <div class="hero-grid">
      <div class="hero-text">
        <p class="eyebrow" data-i18n="sto.eyebrow"></p>
        <h1 id="sto-title">SSD<span class="sub" data-i18n="sto.full"></span></h1>
        <p class="lede" data-i18n="sto.lede"></p>
        <div class="specs">
          <dl><div><dt data-i18n="sto.spec.cap"></dt><dd data-i18n="sto.spec.cap.v"></dd></div></dl>
          <dl><div><dt data-i18n="sto.spec.read"></dt><dd data-i18n="sto.spec.read.v"></dd></div></dl>
          <dl><div><dt data-i18n="sto.spec.access"></dt><dd data-i18n="sto.spec.access.v"></dd></div></dl>

        <div class="viewer" id="sto3d" data-viewer="storage" data-flip data-explode="70"></div>

  <div class="chapter">
    <div class="wrap">
      <div class="chapter-head">
        <p class="eyebrow" data-i18n="sto.hdd.eyebrow"></p>
        <h2 data-i18n="sto.hdd.title"></h2>
        <div class="prose"><p data-i18n="sto.hdd.p"></p></div>
      </div>
      <div class="stage">
        <div class="stage-body scroll-x"><svg id="stoHdd" viewBox="0 0 640 352" width="100%" style="min-width:480px" role="img" data-i18n-aria="sto.hdd.aria"></svg></div>
        <div class="stage-bar">
          <button class="btn primary" id="stoHddRun" type="button" data-i18n="sto.hdd.run"></button>
